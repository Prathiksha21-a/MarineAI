<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Image Detection | MarineAI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static',filename='style.css') }}"
    />
  </head>
  <body>
    {% include '_nav.html' %}
    <main class="page">
      <div class="container">
        <div class="page-heading">
          <h1>Image Detection</h1>
          <p>Upload an image for fish and large-fish analysis.</p>
        </div>
        <label class="upload-zone d-block" id="dropZone"
          >Drop an image here or <strong>browse</strong
          ><input id="imageInput" type="file" accept="image/*"
        /></label>
        <div class="flow-arrow">↓</div>
        <div class="row g-4">
          <div class="col-md-6">
            <h6>Original Image</h6>
            <div class="image-panel">
              <img id="original" hidden /><span id="originalText"
                >Your uploaded image will appear here.</span
              >
            </div>
          </div>
          <div class="col-md-6">
            <h6>Detection Result</h6>
            <div class="image-panel">
              <img id="detected" hidden /><span id="detectText"
                >Analysis result will appear here.</span
              >
            </div>
          </div>
        </div>
        <div class="text-center my-4">
          <button id="analyze" class="btn btn-primary" disabled>
            Analyze Image
          </button>
        </div>
        <div id="results" hidden>
          <div class="flow-arrow">↓</div>
          <div
            class="result-card abundance-card mx-auto mb-4"
            style="max-width: 500px"
          >
            <h6>Fish Abundance</h6>
            <h2 id="abundance">-</h2>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <div class="result-card">
                <h6>Fish Present</h6>
                <h3 id="fishPresent">-</h3>
              </div>
            </div>
            <div class="col-md-4">
              <div class="result-card">
                <h6>Large Fish</h6>
                <h3 id="largeFish">-</h3>
              </div>
            </div>
            <div class="col-md-4">
              <div class="result-card">
                <h6>Species</h6>
                <h3 id="species">-</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="{{ url_for('static',filename='script.js') }}"></script>
    <script>
      const input = document.querySelector("#imageInput"),
        zone = document.querySelector("#dropZone"),
        orig = document.querySelector("#original"),
        button = document.querySelector("#analyze");
      let selected;
      function choose(file) {
        if (!file || !file.type.startsWith("image/")) return;
        selected = file;
        orig.src = URL.createObjectURL(file);
        orig.hidden = false;
        document.querySelector("#originalText").hidden = true;
        button.disabled = false;
      }
      input.onchange = () => choose(input.files[0]);
      ["dragenter", "dragover"].forEach((e) =>
        zone.addEventListener(e, (x) => {
          x.preventDefault();
          zone.classList.add("dragover");
        }),
      );
      ["dragleave", "drop"].forEach((e) =>
        zone.addEventListener(e, (x) => {
          x.preventDefault();
          zone.classList.remove("dragover");
        }),
      );
      zone.addEventListener("drop", (e) => choose(e.dataTransfer.files[0]));
      button.onclick = async () => {
        button.disabled = true;
        button.textContent = "Analyzing…";
        const f = new FormData();
        f.append("image", selected);
        try {
          const r = await fetch("/predict", { method: "POST", body: f }),
            d = await r.json();
          if (!r.ok) throw Error(d.error);
          const result = document.querySelector("#detected");
          result.src = "/" + d.output_image + "?t=" + Date.now();
          result.hidden = false;
          document.querySelector("#detectText").hidden = true;
          document.querySelector("#fishPresent").textContent = d.fish_present;
          document.querySelector("#abundance").textContent =
            d.fish_abundance.toUpperCase();
          document.querySelector("#largeFish").textContent = d.large_fish;
          document.querySelector("#species").textContent = d.species;
          document.querySelector("#results").hidden = false;
        } catch (e) {
          alert(e.message || "Analysis failed");
        } finally {
          button.disabled = false;
          button.textContent = "Analyze Image";
        }
      };
    </script>
  </body>
</html>
