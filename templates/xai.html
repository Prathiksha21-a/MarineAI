<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explainable AI | MarineAI</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    {% include '_nav.html' %}

    <main class="page">
      <div class="container">
        <div class="page-heading">
          <h1>Explainable AI</h1>
          <p>
            MarineAI uses LayerCAM to visualize image regions contributing to
            YOLOv11 predictions.
          </p>
        </div>

        <label class="upload-zone d-block">
          Upload an image for LayerCAM
          <input id="input" type="file" accept="image/*" />
        </label>

        <div class="flow-arrow">↓</div>

        <div class="row g-4">
          <div class="col-md-6">
            <h6>Original Image</h6>

            <div class="image-panel xai-panel">
              <img id="original" hidden alt="Original uploaded image" />

              <span id="originalText"> Upload an image to begin. </span>
            </div>
          </div>

          <div class="col-md-6">
            <h6>LayerCAM Visualization</h6>

            <div class="image-panel xai-panel">
              <img id="xai" hidden alt="LayerCAM visualization" />

              <span id="xaiText"> Visualization will appear here. </span>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button id="run" class="btn btn-primary" disabled>
            Generate Visualization
          </button>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
      const input = document.querySelector("#input");
      const original = document.querySelector("#original");
      const originalText = document.querySelector("#originalText");
      const run = document.querySelector("#run");
      const xaiImage = document.querySelector("#xai");
      const xaiText = document.querySelector("#xaiText");

      let file;

      input.onchange = () => {
        file = input.files[0];

        if (file) {
          original.src = URL.createObjectURL(file);

          original.hidden = false;
          originalText.hidden = true;

          run.disabled = false;
        }
      };

      run.onclick = async () => {
        run.disabled = true;
        run.textContent = "Generating...";

        const formData = new FormData();
        formData.append("image", file);

        try {
          const response = await fetch("/xai_predict", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) throw Error(data.error);

          xaiImage.src = "/" + data.xai_image + "?t=" + Date.now();

          xaiImage.hidden = false;
          xaiText.hidden = true;
        } catch (error) {
          alert(error.message || "Visualization failed");
        } finally {
          run.disabled = false;
          run.textContent = "Generate Visualization";
        }
      };
    </script>
  </body>
</html>
